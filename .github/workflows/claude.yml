name: Claude Code

# Responds when someone types "@claude ..." in an issue comment, a PR review
# comment, a PR review body, or a new issue. Requires:
#   1. The Claude GitHub App installed on this repo (github.com/apps/claude)
#   2. Repo secret ANTHROPIC_API_KEY set (Settings -> Secrets and variables -> Actions)
# Until both exist this workflow is inert (it only acts on an explicit @claude mention).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when the trigger text actually mentions @claude (avoids wasted runs).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    env:
      HAVE_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1
        # ANTHROPIC_API_KEY has never been configured on this repo, so without this
        # guard the action fails and the whole job goes red. A board carrying a
        # permanent red run next to the genuine one is a board people stop reading.
        # Skipping the step keeps the job green, and it starts working the moment the
        # key is added — no edit required.
        #
        # The secret is read through a job-level `env` because actionlint (correctly)
        # rejects a `secrets` reference in BOTH a job-level and a step-level `if:`;
        # `env` is allowed in a step-level one.
        if: env.HAVE_ANTHROPIC_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
