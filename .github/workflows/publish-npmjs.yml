name: Publish @tyroneross/build-loop to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run 'npm publish --dry-run' instead of publishing"
        required: false
        default: "true"
      verify_only:
        description: "Only verify npmjs metadata for the package.json version"
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@tyroneross"
          package-manager-cache: false

      # 11.5.1 is the documented floor for trusted publishing, not a preference.
      # https://docs.npmjs.com/trusted-publishers/
      - name: Use npm >= 11.5.1 (trusted-publishing floor)
        run: npm install -g npm@^11.5.1

      - name: Verify npm
        run: npm --version

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi
          echo "Version match: $PKG_VERSION"

      - name: Setup Python
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.verify_only != 'true')
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Python release preflight
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.verify_only != 'true')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          python3 scripts/verify_release_surface.py \
            --version "$PKG_VERSION" \
            --branch "${GITHUB_REF_NAME}" \
            --skip-check local_commit_log \
            --skip-check local_tag \
            --skip-check branch_head_sha \
            --skip-check remote_refs \
            --json

      # Fail loudly on a misconfigured publisher BEFORE the publish, not inside it.
      # v0.36.4 failed at the publish step on 2026-07-12 and npmjs sat at 0.36.1 for
      # ~7 weeks — the registry the README tells users to install from. That error is
      # now past log retention, so a preflight exists to make the next failure name
      # itself instead of becoming another silent gap.
      #
      # There is no credential left to check. This publishes via npm TRUSTED
      # PUBLISHING (OIDC): GitHub mints a short-lived, workflow-scoped token that
      # npm exchanges for publish rights, so no long-lived NPM_TOKEN is stored,
      # rotated, or leakable from this repository. What CAN still be wrong is the
      # preconditions, and each of them fails silently or confusingly at publish
      # time, so they are asserted here where the message can say what to fix.
      - name: Verify trusted-publishing preconditions
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # npm >= 11.5.1 and Node >= 22.14.0 are the documented floors.
          # https://docs.npmjs.com/trusted-publishers/
          NPM_V=$(npm --version)
          NODE_V=$(node --version | sed 's/^v//')
          echo "npm $NPM_V, node $NODE_V"
          node -e '
            const [npmV, nodeV] = process.argv.slice(1);
            const lt = (a, b) => {
              const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) {
                if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) < (pb[i] || 0);
              }
              return false;
            };
            if (lt(npmV, "11.5.1")) {
              console.log("::error::npm " + npmV + " is below the 11.5.1 trusted-publishing floor");
              process.exit(1);
            }
            if (lt(nodeV, "22.14.0")) {
              console.log("::error::node " + nodeV + " is below the 22.14.0 trusted-publishing floor");
              process.exit(1);
            }
          ' "$NPM_V" "$NODE_V"
          # OIDC is only reachable when the job requested id-token: write. Without it
          # npm falls back to looking for a token and reports a confusing 401/ENEEDAUTH.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token available — this job needs 'permissions: id-token: write'."
            exit 1
          fi
          echo "OIDC token endpoint present; publishing as a trusted publisher."
          # A trusted publisher is configured on npmjs, NOT in this file, so a
          # mismatch is invisible here. npmjs matches on owner + repo + WORKFLOW
          # FILENAME, so renaming this file silently breaks publishing.
          echo "npmjs must list: repo tyroneross/build-loop, workflow publish-npmjs.yml"


      - name: Check npmjs version
        id: npmjs_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tyroneross/build-loop@$PKG_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@tyroneross/build-loop@$PKG_VERSION already exists on npmjs"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "@tyroneross/build-loop@$PKG_VERSION is not published on npmjs"
          fi

      - name: Install dependencies
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.verify_only != 'true') && (github.event_name != 'release' || steps.npmjs_version.outputs.exists != 'true')
        run: npm ci

      - name: Build
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.verify_only != 'true') && (github.event_name != 'release' || steps.npmjs_version.outputs.exists != 'true')
        run: npm run build

      - name: Publish to npmjs (dry-run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.verify_only != 'true' && github.event.inputs.dry_run == 'true'
        # No NODE_AUTH_TOKEN: a token in the environment takes precedence and would
        # quietly publish via the old path, so leaving one here would mean this
        # workflow never actually exercises OIDC.
        run: npm publish --dry-run --provenance --access public --registry=https://registry.npmjs.org

      - name: Publish to npmjs
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.verify_only != 'true' && github.event.inputs.dry_run != 'true')) && steps.npmjs_version.outputs.exists != 'true'
        # No NODE_AUTH_TOKEN — see the dry-run step above.
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org

      - name: Skip npmjs publish
        if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.verify_only != 'true' && github.event.inputs.dry_run != 'true')) && steps.npmjs_version.outputs.exists == 'true'
        run: echo "Skipping npmjs publish because this version is already present."

      - name: Verify npmjs metadata
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.verify_only == 'true' || github.event.inputs.dry_run != 'true'))
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 12); do
            if npm view "@tyroneross/build-loop@$PKG_VERSION" dist-tags dist.attestations --json --registry=https://registry.npmjs.org; then
              exit 0
            fi
            echo "npmjs metadata not visible yet for $PKG_VERSION; retry $attempt/12"
            sleep 30
          done
          echo "::error::npmjs metadata did not become visible for @tyroneross/build-loop@$PKG_VERSION"
          exit 1
