[package]
name = "bl"
description = "build-loop native commands: the hooks (bl hook pre-edit, bl hook trace), the model resolver (bl route) and the experimental agent driver (bl run)."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bl-contract = { path = "../bl-contract" }
bl-route = { path = "../bl-route" }
bl-acp = { path = "../bl-acp" }
bl-gate = { path = "../bl-gate" }
serde_json = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
